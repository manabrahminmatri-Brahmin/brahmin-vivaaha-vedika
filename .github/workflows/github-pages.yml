# Publish web_deploy/ to GitHub Pages on every push to main.
# Site URL: https://manabrahminmatri-brahmin.github.io/brahmin-vivaaha-vedika/
# Repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions (not "Deploy from branch").
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build site from web_deploy
        run: |
          mkdir -p _site
          cp -r web_deploy/. _site/
          echo "Published files:"
          find _site -type f | head -50

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Publish web_deploy/ to gh-pages branch for GitHub Pages.
# Settings -> Pages -> Deploy from branch -> gh-pages -> / (root)
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'web_deploy/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          touch web_deploy/.nojekyll
          test -f web_deploy/index.html

      - name: Publish web_deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_deploy
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy website from web_deploy/'

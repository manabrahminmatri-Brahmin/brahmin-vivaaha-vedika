# Increase memory allocation for faster builds (adjust based on your RAM)
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -XX:MaxGCPauseMillis=200
android.useAndroidX=true
android.enableJetifier=false
# Enable Gradle build cache
org.gradle.caching=true
# Enable parallel builds
org.gradle.parallel=true
# Enable configure-on-demand (faster configuration)
org.gradle.configureondemand=true
# Enable daemon for faster subsequent builds
org.gradle.daemon=true
# Non-interactive mode
org.gradle.console=plain
# Reduce build output verbosity
org.gradle.logging.level=warn
# Disable Kotlin incremental compilation to fix cross-drive build issues
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx1536m -XX:+UseParallelGC
# Avoid separate Kotlin compile daemon (fixes "Could not connect to Kotlin compile daemon" on Windows)
kotlin.compiler.execution.strategy=in-process
# Suppress Java 8 obsolete warnings from Flutter plugins
org.gradle.warning.mode=none
# App uses AGP built-in Kotlin (no kotlin-android Gradle plugin on :app).
android.builtInKotlin=true
# AGP 9+ new DSL (opt in; pairs with android.builtInKotlin=true).
android.newDsl=true
